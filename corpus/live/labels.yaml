# Labels for the frames captured on 2026-10-08 with `python -m ngoalong.tools.explore`
# (docs/08, phase R0). One entry per frame, all positions canvas-relative (1000x600).
#
# base:    the screen underneath (map/location)       dialogs: open dialogs, top last
# overlay: toasts, banners, loading bars              state:   values a reader must return
# frame:   the dialog frame style (see docs/08 "Live exploration"):
#          medium = 802,119 close; large = 855,85 close; small = title bar + close; panel = no title plaque
#
# Every frame: canvas found HIGH at (40, 110) x1.00.
#
# Machine-readable for `tools/perceive.py --bench` (docs/08 R1): base / dialogs / overlay are the
# expected screen stack in the names of profiles/ngoalongviet/screens/*.yaml. A base or dialog that
# no screen file declares (tavern, hoat_dong_daily, ...) is expected as "unknown" (an unknown base,
# or an unknown dialog with its ✕ listed); region / resources / event_dungeon are expected as "map".
# Overlays no screen declares (banner, loading, chat_expanded) are not compared. A `state` key is
# compared when a screen on the frame has a reader of that name; ranges like "20→11" are skipped.
# out_of_scope: true frames are skipped.

