# Template crop list for tools/cut_templates.py (reproducible template cutting): the templates that
# are not UI parts (those are in part_crops.yaml): the canvas locator's anchors, the pop-ups closed
# by the interrupts (popups.yaml), the HUD panels they collapse (panels.yaml) and one part.
#
# sources: screenshot alias -> file (relative to the project root) + the canvas top-left corner in
#          that file. Reference screenshots: measured with the black-border method (docs/07).
#          Live captures (docs/game screenshots/live/): canvas at client (180, 110) in every file.
# crops:   name (dots = folders under templates/), source alias, rect = canvas [x, y, w, h] at
#          1000x600, optional mask (ellipse). The `at` of a popups.yaml / panels.yaml / locator.yaml
#          entry is the rect's (x, y).
#
# Regenerate:  .venv\Scripts\python.exe tools/cut_templates.py
# Verify:      .venv\Scripts\python.exe tools/cut_templates.py --check

sources:
  main: {path: "docs/game screenshots/main-game.png", origin: [273, 109]}
  live_city: {path: "docs/game screenshots/live/01-city-main.png", origin: [180, 110]}
  live_dungeon_list: {path: "docs/game screenshots/live/05-pho-ban-list.png", origin: [180, 110]}
  live_pho_ban: {path: "docs/game screenshots/live/04-pho-ban.png", origin: [180, 110]}
  # "Bỏ qua thời gian chờ tốn 13 Vàng. Xác nhận?" after "Tăng cấp" on a building (2026-10-06; a
  # smaller Coowon window: canvas at client (45, 110)). Answered by the popup guard's gold policy.
  live_gold_skip: {path: "docs/game screenshots/live/51-gold-skip-wait-confirm.png", origin: [45, 110]}
  # Reward modal "Chúc mừng ngài được" over the tower battle (a debug-mode frame of a user run,
  # 2026-10-06; moved here from tests/fixtures/, removed in R0).
  live_reward: {path: "docs/game screenshots/live/50-reward-modal-chuc-mung.png", origin: [180, 110]}

crops:
  # --- canvas locator anchors (fixed HUD pieces) -------------------------------------------------
  - {name: anchor.kvuc_label, source: main, rect: [2, 574, 40, 22]}      # chat input "K.Vực" box
  - {name: anchor.chat_send, source: main, rect: [222, 574, 54, 22]}     # chat emoji + send button
  - {name: anchor.hud_gear, source: main, rect: [751, 5, 22, 22], mask: ellipse}  # settings gear

  # --- pop-ups (popups.yaml) ------------------------------------------------------------------------
  - {name: overlay.toast.view, source: main, rect: [886, 423, 84, 24]}            # toast "Xem ngay"
  - {name: overlay.toast.close, source: main, rect: [976, 304, 20, 20]}           # toast ✕
  - {name: popup.gold_skip.no_remind, source: live_gold_skip, rect: [424, 310, 168, 20]}  # ☐ "Lần sau không nhắc nhở"
  - {name: popup.gold_skip.ok, source: live_gold_skip, rect: [418, 340, 74, 20]}         # 确定 (left: spend Vàng)
  - {name: popup.gold_skip.cancel, source: live_gold_skip, rect: [509, 340, 74, 20]}     # 取消 (right)
  - {name: popup.reward.title, source: live_reward, rect: [436, 229, 120, 15]}    # "Chúc mừng ngài được"
  - {name: popup.reward.ok, source: live_reward, rect: [458, 341, 74, 22]}        # 确定 of the reward modal

  # --- HUD panels (panels.yaml) ---------------------------------------------------------------------
  - {name: field.hud.quest_collapse, source: live_pho_ban, rect: [807, 165, 20, 26]} # "▶" (= AnKhungThongBao)
  - {name: hud.chat_collapse, source: live_city, rect: [3, 549, 15, 16]}             # "⌄" left of "Chung": chat log open (collapsed shows "⌃")
  - {name: hud.sap_mo, source: live_city, rect: [64, 268, 48, 17]}                   # "Sắp mở" title of the upcoming-building box

  # --- parts.yaml -----------------------------------------------------------------------------------
  - {name: field.dungeon_list.title, source: live_dungeon_list, rect: [470, 363, 60, 18]}  # "Phó bản" (part field.dungeon_list)
