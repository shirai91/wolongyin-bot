# Template crop list for tools/cut_templates.py (reproducible template cutting).
#
# sources: screenshot alias -> file (relative to the project root) + the canvas top-left corner in
#          that file. Reference screenshots: measured with the black-border method (docs/07);
#          tower-in-dungeon: from the chat-bar anchors (its dark scene defeats the border method).
#          Live captures (docs/game screenshots/live/): canvas at client (180, 110) in every file.
# crops:   name (dots = folders under templates/), source alias, rect = canvas [x, y, w, h] at
#          1000x600, optional mask (ellipse). Scenes and the locator reference these names; the
#          `at` of a signature item is the rect's (x, y).
#
# Regenerate:  .venv\Scripts\python.exe tools/cut_templates.py
# Verify:      .venv\Scripts\python.exe tools/cut_templates.py --check

