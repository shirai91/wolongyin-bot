# Clear Phó Bản (v1.8.0 CLEARMAP) on the field (docs/03, docs/07). Canvas coordinates at 1000x600.
#
# `field.clear_map` groups what the feature looks for on the dungeon map. Its signature is the same as
# `field` (scenes/field.yaml) and its priority is lower, so detect() always returns `field` first: this
# scene never competes with a real scene, it only names the objects (features use find_object).
#
# Live crops (docs/game screenshots/live/04, 08): the v1.8.0 images Button_AnChucNang (HUD ">>"),
# AnKhungThongBao (quest tracker "▶") and DaoQuan_2/_3 (red army flag) match these exactly (1.00).
# Legacy objects (`at: [0, 0]`, margin 1000 = anywhere on the canvas): v1.8.0 ClearMap images of
# popups whose position varies. Checked on two live captures (tests/fixtures/screens/clear_map/):
# `level_up` (the big yellow "+") and `notice_close` (✕ of "Phó Bản ... đã mở ra") match 1.00;
# `result` (Button_KetQua) is a piece of the "第N回合" round label, so it marks the whole battle
# screen; the live result box is 战胜 (`win_zh`, 1.00) with "Xem lại" / "Thoát" (540, 408), the
# button v1.8.0 clicked as (538, 409). Thresholds: best score on the 47 stored non-battle screens is
# <= 0.63 (result, level_up) and 0.34 (recruit_max). `recruit_prompt` and `notice_close` are generic
# dialog pieces (dialog border ornament, red ✕) that also match many live dialogs: the feature only
# uses them where v1.8.0 did (right after an attack / at the top of a loop on the map).

field.clear_map:
  kind: screen
  priority: -100
  description: "Phó Bản map, objects used by Clear Phó Bản (never wins detect: same signature as field)"
  signature:
    - {template: field.name_bar_left, at: [436, 565]}
  objects:
    dungeon_bar: {template: field.name_bar_left, at: [436, 565], description: "dungeon-name bar (field shown)"}
    hud_toggle: {template: field.hud.icons_toggle, at: [822, 70], description: "'>>': HUD icon rows are expanded"}
    quest_collapse: {template: field.hud.quest_collapse, at: [807, 165], description: "'▶': quest tracker expanded"}
    next_dungeon: {template: field.next_dungeon, at: [570, 568], description: "'»' (only when a next dungeon exists)"}
    army_attack: {template: field.army_dialog.attack, at: [556, 293], description: "army dialog 'Tấn công'"}
    # legacy v1.8.0 popups, position unknown
    result: {template: clear_map.result, at: [0, 0], margin: 1000, threshold: 0.95, description: "Button_KetQua"}
    win: {template: tower.result.win, at: [0, 0], margin: 1000, threshold: 0.8, description: "'Thắng Trận' box"}
    win_zh: {template: tower.result.win_zh, at: [0, 0], margin: 1000, threshold: 0.8}
    lose: {template: tower.result.lose, at: [0, 0], margin: 1000, threshold: 0.8, description: "'Bại Trận' box"}
    lose_zh: {template: tower.result.lose_zh, at: [0, 0], margin: 1000, threshold: 0.8}
    recruit_max: {template: clear_map.recruit.max, at: [0, 0], margin: 1000, threshold: 0.85, description: "recruit dialog '−' '+' (Button_ChieuBinh_ToiDa)"}
    recruit_prompt: {template: clear_map.recruit.prompt, at: [0, 0], margin: 1000, threshold: 0.95, description: "dialog ornament (Button_ChieuBinh): v1.8.0's 'must recruit' cue"}
    level_up: {template: clear_map.level_up, at: [0, 0], margin: 1000, threshold: 0.9, description: "Chúa công lên cấp '+' (ChuaCongLenCap)"}
    notice_close: {template: clear_map.notice_close, at: [0, 0], margin: 1000, threshold: 0.95, description: "red ✕ of the new-dungeon notice (ThongBaoPhoBanMoi)"}
