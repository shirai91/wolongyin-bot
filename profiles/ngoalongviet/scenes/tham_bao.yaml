# Thám Bảo (v1.8.0 THAMBAO), docs/03. Canvas coordinates at 1000x600.
#
# NOT verified on ngoalongviet.com: the live recon (docs/07 "Not reached") found no Thám Bảo entry,
# so every template here is a v1.8.0 ThamBao image taken whole (`at: [0, 0]`, margin 1000 = anywhere
# on the canvas). Replace them with live crops once the screen is captured.
#
# The scene is a low-priority screen so it is only tried when no catalogued scene matched (one
# canvas-wide search of an 18x8 template). Click offsets are in coords/tham_bao.yaml; the objects
# below are the markers the feature checks with find_object. Thresholds: best score of each image on
# the 47 stored screens is sweep 0.90, sweep_alt 0.69, opponent 0.77, result 0.72, lost 0.74,
# claimed 0.63, reward_x2 0.53 (tools: tests/test_feature_tham_bao.py::test_legacy_markers_do_not_fire_on_stored_screens).
# reward_x2 (TB_QuaX2, the x2 reward bag) is used by the P3 "Nhận quà x2" option; re-cut it with the
# "Mẫu ảnh" tab (ngoalong/tools/template_tool.py) once the screen is captured live.
# Not converted: TB_NhanThuong (matches generic dialog pieces 1.00 live) and TB_ThemLenh (v1.8.0
# never used it).

tham_bao:
  kind: screen
  priority: -100
  description: "Thám Bảo board: the 'Càn quét' (sweep) button is shown between rounds (v1.8.0 images)"
  signature:
    - {template: tham_bao.sweep, at: [0, 0], margin: 1000, threshold: 0.95}
  objects:
    sweep: {template: tham_bao.sweep, at: [0, 0], margin: 1000, threshold: 0.95, description: "Càn quét (TB_CanQuet)"}
    sweep_alt: {template: tham_bao.sweep_alt, at: [0, 0], margin: 1000, threshold: 0.9, description: "Càn quét, 2nd look (TB_CanQuet2)"}
    opponent: {template: tham_bao.opponent, at: [0, 0], margin: 1000, threshold: 0.9, description: "opponent box (TB_DoiThu)"}
    result: {template: tham_bao.result, at: [0, 0], margin: 1000, threshold: 0.95, description: "fight result (TB_KetQua)"}
    lost: {template: tham_bao.lost, at: [0, 0], margin: 1000, threshold: 0.9, description: "'mất thất' popup (TB_MatThat)"}
    claimed: {template: tham_bao.claimed, at: [0, 0], margin: 1000, threshold: 0.9, description: "reward already claimed (TB_DaNhanThuong)"}
    reward_x2: {template: tham_bao.reward_x2, at: [0, 0], margin: 1000, threshold: 0.9, description: "x2 reward bag (TB_QuaX2)"}
    # The live battle result box (战胜 / 战败, "Thoát" at (540, 408)); TB_KetQua above is a piece of the
    # battle screen's "第N回合" round label (both checked on a live capture, 2026-10-06).
    win_box: {template: tower.result.win_zh, at: [0, 0], margin: 1000, threshold: 0.8, description: "战胜"}
    lose_box: {template: tower.result.lose_zh, at: [0, 0], margin: 1000, threshold: 0.8, description: "战败"}
