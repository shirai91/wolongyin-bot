# Trial tower (Tháp Thí Luyện) scenes (docs/07).

tower.dialog:
  kind: modal
  description: "Tháp Thí Luyện dialog (10 floor slots per page; only unlocked floors are shown)"
  signature:
    - {template: tower.dialog.title, at: [448, 101], threshold: 0.9}
  objects:
    floor_1: {offset: [247, 218], description: "Tầng 1; Tầng n at y 218 + 25*(n-1)"}
    page_back: {offset: [206, 476]}
    page_next: {offset: [291, 476]}
    page_box: {offset: [247, 476]}
    challenge: {offset: [367, 469], description: "Vượt Tháp"}
    strategy: {offset: [453, 469], description: "Chiến lược"}
    auto_climb: {offset: [538, 469], description: "Tự Vượt Tháp"}
    close: {offset: [803, 118]}

tower.confirm:
  kind: modal
  priority: 10  # sits on top of tower.dialog
  description: "Confirm box 'Mỗi lần Vượt tháp mất 3 Thí luyện lệnh'"
  signature:
    - {template: tower.confirm.text, at: [350, 282]}
    - {template: tower.confirm.ok, at: [420, 320]}
  objects:
    ok: {template: tower.confirm.ok, at: [420, 320], offset: [453, 331], description: "确定"}
    cancel: {offset: [546, 331], description: "取消"}

tower.exit_confirm:
  kind: modal
  priority: 5  # below tower.confirm (same frame and 确定 button, other text)
  description: "Any confirm box with 确定 at the tower.confirm place, e.g. after 'Thoát' (v1.8.0 clicked Đồng ý (455, 325) there; not yet seen live)"
  signature:
    - {template: tower.confirm.ok, at: [420, 320]}
  objects:
    ok: {template: tower.confirm.ok, at: [420, 320], offset: [453, 331], description: "确定"}
    cancel: {offset: [546, 331], description: "取消"}

tower.battle:
  kind: screen
  description: "Inside the tower: 'Tầng N' top-centre, 'Thoát' bottom-right (HUD hidden)"
  signature:
    - {template: tower.battle.floor_label, at: [480, 12]}
    - {template: tower.battle.exit, at: [926, 553]}
  objects:
    exit: {template: tower.battle.exit, at: [926, 553], offset: [960, 563], description: "Thoát"}
    auto_climb: {offset: [741, 563], description: "Tự Vượt Tháp checkbox"}
    auto_label: {template: tower.battle.auto_label, at: [755, 553]}
