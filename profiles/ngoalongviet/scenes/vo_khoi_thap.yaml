# Võ Khôi Tháp boss screen (docs/07), live capture 2026-10-06
# (docs/game screenshots/live/44-vo-khoi-thap.png). It opens from the "Võ Khôi Tháp" marker on the
# world map (vo_khoi_thap.vkt_entry (235, 330)) and takes several seconds to load. The HUD is hidden.
# Click offsets are in coords/vo_khoi_thap.yaml; the objects below document what they hit.

vo_khoi_thap:
  kind: screen
  description: "Võ Khôi Tháp boss screen: title top-centre, boss arrows, 'Tấn công', 'Thoát'"
  signature:
    - {template: vo_khoi_thap.screen.title, at: [458, 4]}
    - {template: vo_khoi_thap.screen.exit, at: [462, 567]}
  objects:
    exit: {template: vo_khoi_thap.screen.exit, at: [462, 567], offset: [495, 575], description: "Thoát"}
    attack: {offset: [475, 490], description: "Tấn công (button about x 462-543, y 482-519)"}
    boss_prev: {offset: [265, 305], description: "'<' (arrow about (265, 308))"}
    boss_next: {offset: [730, 305], description: "'>' (arrow about (730, 308))"}
