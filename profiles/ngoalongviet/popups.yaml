# Pop-ups the bot closes by itself, whatever feature is running (interrupts, ngoalong/engine/interrupts.py).
# Checked on every tick before the feature's rules; one click per tick, then the next Snapshot.
#
# Plain entries are HARMLESS NOTICES only: pop-ups whose button just closes them. A pop-up that
# costs something is listed only with a `policy` (a setting the user switches on; declined and the
# task stopped when off). Never list a dialog a feature answers itself (tower.confirm, battle
# results, buy / exchange boxes inside a feature's own flow).
#
# signature: template that identifies the pop-up; at = canvas top-left where it was cut (1000x600);
#            margin = extra search room on each side (px); threshold = match score needed.
# dismiss:   the button to click, searched near its own `at` moved by as much as the signature
#            moved; or {click: signature} to click the signature match itself.
# Add a new pop-up: capture it (python -m ngoalong.tools.explore), add its title and close button
# to template_crops.yaml, cut them (tools/cut_templates.py) and add an entry below.

gold_skip_wait:
  # "Bỏ qua thời gian chờ tốn N Vàng. Xác nhận?" (the first line depends on the task). Recognised by
  # the unchanging "☐ Lần sau không nhắc nhở" line plus both buttons. The checkbox is NEVER ticked:
  # it would make the game spend Vàng without asking. Answered by Settings.game.spend_gold_skip_wait.
  description: "Hỏi dùng Vàng bỏ qua thời gian chờ"
  policy: spend_gold_skip_wait
  signature: {template: popup.gold_skip.no_remind, at: [424, 310], margin: 60, threshold: 0.85}
  dismiss: {template: popup.gold_skip.ok, at: [418, 340], margin: 15, threshold: 0.85}
  decline: {template: popup.gold_skip.cancel, at: [509, 340], margin: 15, threshold: 0.85}
  stop_message: >-
    game hỏi dùng Vàng để bỏ qua thời gian chờ; đã bấm Huỷ vì "Dùng vàng bỏ qua thời gian chờ"
    đang tắt (thẻ Cài đặt)

reward:
  description: "Chúc mừng ngài được (phần thưởng, huân chương)"
  signature: {template: popup.reward.title, at: [436, 229], margin: 40, threshold: 0.85}
  dismiss: {template: popup.reward.ok, at: [458, 341], margin: 20, threshold: 0.8}

toast:
  description: "Thông báo góc phải (Bảo vật, Tửu Quán, ...)"
  signature: {template: overlay.toast.view, at: [886, 423], margin: 20, threshold: 0.85}
  dismiss: {template: overlay.toast.close, at: [976, 304], margin: 12, threshold: 0.85}

story:
  # A story box with a portrait ("Giờ là mùa hè năm 189, lần Trưng thu hè +3."), no button and no ✕:
  # "(任意点击继续)" = click anywhere to go on. Seen on the world map after a new game day (frame 522).
  description: "Hộp thoại cốt truyện (bấm để tiếp tục)"
  signature: {template: part.popup.story, at: [548, 322], margin: 80, threshold: 0.85}
  dismiss: {click: signature}
