hud.icons_shown:      {template: part.hud.icons_shown, search: [800, 55, 60, 45]}   # ">>": click it to hide the top icon rows
box.no_remind:        {template: popup.gold_skip.no_remind, search: [340, 260, 320, 110], threshold: 0.85}  # "☐ Lần sau không nhắc nhở" of a spend-Vàng box

# --- structures (R3) ----------------------------------------------------------------------------
# A building label "lvN": the white "lv" (dark outline) matched on its white ink, so map art, season
# and animations under it do not matter; the level is read with the digit glyphs right after it.
map.lv:               {template: part.map.lv, search: [0, 20, 1000, 505], ink: 170, threshold: 0.91, multi: true, max_hits: 40}  # real labels 0.93-1.00, anything else <= 0.89
hud.notice_open:      {template: part.hud.notice_open, search: [0, 118, 28, 32]}   # "<<" of the left notice list: click it to collapse the list

# --- campaign and Võ Khôi Tháp (R3) ---------------------------------------------------------------
hud.world:            {template: part.hud.world, search: [915, 465, 60, 55], threshold: 0.80}    # "Thế Giới" in the bottom-right cluster (any map)
hud.pho_ban:          {template: part.hud.pho_ban, search: [870, 520, 60, 60], threshold: 0.80}  # "Phó Bản" in the same cluster: the campaign field
vkt.silver_alert:     {template: part.vkt.silver_alert, search: [320, 265, 220, 50]}              # the 2-billion silver alert (frame 538), nested in the VKT result box
vkt.alert_cancel:     {template: part.vkt.alert_cancel, search: [490, 305, 120, 45], threshold: 0.80}  # its "Hủy bỏ" (Cường hóa sits left of it)
