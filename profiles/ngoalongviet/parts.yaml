# UI parts: the pieces of game UI the perception layer looks for (docs/08 "UI parts", phase R1).
#
# template:  name under templates/ (cut by part_crops.yaml)
# search:    canvas region [x, y, w, h] at 1000x600 where the part may appear; "canvas" = anywhere.
#            Keep it tight: short button texts look alike across the UI and only separate by place.
# threshold: score needed (TM_CCOEFF_NORMED); default 0.90. A button under the bot's own cursor (the
#            mouse stays where it last clicked) glows and scores lower: those get 0.80.
# multi:     true when several copies can show at once (✕ of stacked dialogs, magic circles)
#
# Score them over the corpus:  .venv\Scripts\python.exe tools/part_report.py

# --- generic -------------------------------------------------------------------------------------
close:                {template: part.close, search: canvas, multi: true}
box.ok:               {template: part.box.ok, search: [330, 280, 340, 130]}
box.cancel:           {template: part.box.cancel, search: [330, 280, 340, 130]}

# --- map HUD -------------------------------------------------------------------------------------
hud.silver_label:     {template: part.hud.silver_label, search: [80, 20, 60, 30]}
hud.home:             {template: part.hud.home, search: [920, 530, 80, 70]}
