bar.khoa_ky:          {template: part.bar.khoa_ky, search: [480, 525, 420, 50]}
bar.trang_bi:         {template: part.bar.trang_bi, search: [480, 525, 420, 50], threshold: 0.80}  # hover 0.85
map.vao_hai_cang:     {template: part.map.vao_hai_cang, search: [250, 470, 150, 60]}
map.hai_chien:        {template: part.map.hai_chien, search: [320, 490, 120, 50]}
map.vo_khoi_thap:     {template: part.map.vo_khoi_thap, search: [170, 340, 140, 50]}
field.next:           {template: part.field.next, search: [450, 555, 250, 45]}

