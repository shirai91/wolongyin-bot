  - {name: part.btn.building_upgrade, source: building, rect: [345, 316, 58, 20]}  # Tăng cấp (building panel)
  - {name: part.btn.panel_tower, source: tower_building, rect: [484, 314, 76, 16]}  # "Tháp Thí Luyện" (tower building panel)
  - {name: part.btn.research_upgrade, source: research, rect: [580, 461, 70, 22]}  # Tăng cấp (Phủ Sách Lược)
  - {name: part.btn.vuot_thap, source: tower_dialog, rect: [334, 460, 70, 20]}
  - {name: part.btn.tu_vuot_thap, source: tower_dialog, rect: [500, 460, 76, 20]}
  - {name: part.btn.attack, source: army, rect: [558, 295, 52, 20]}                # Tấn công (army dialog)
  - {name: part.btn.mua, source: shop, rect: [468, 454, 72, 20]}
  - {name: part.shop.silver_chest, source: shop, rect: [310, 387, 48, 48]}

  # --- tower floor and battle results ------------------------------------------------------------
