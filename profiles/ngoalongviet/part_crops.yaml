# UI-part templates for the new perception layer (docs/08, phase R1), cut from the live corpus.
#
# Sources are canvas captures from `python -m ngoalong.tools.explore` (corpus/live/, ignored by git),
# so origin is [0, 0] and rect is canvas x, y, w, h at 1000x600. Names map to templates/part/...
# Only the 6 supported features are covered (docs/08 "Supported features").
# Checkboxes (Tự Vượt Tháp, Phát chiến đấu) and selected tabs are colour probes, not templates.
#
# Regenerate (needs the corpus locally):
#   .venv\Scripts\python.exe tools/cut_templates.py --crops profiles/ngoalongviet/part_crops.yaml
# Score every part over the corpus:
#   .venv\Scripts\python.exe tools/part_report.py

