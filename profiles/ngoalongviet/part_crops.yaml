  - {name: part.tower.exit, source: tower_floor, rect: [926, 555, 70, 22]}         # Thoát (floor map)
  - {name: part.tower.auto_label, source: tower_floor, rect: [752, 555, 66, 18]}   # "Tự Vượt Th"
