# UI-part templates for the new perception layer (docs/08, phase R1), cut from the live corpus.
#
# Sources are canvas captures from `python -m ngoalong.tools.explore` (corpus/live/, ignored by git),
# so origin is [0, 0] and rect is canvas x, y, w, h at 1000x600. Names map to templates/part/...
# Only the 6 supported features are covered (docs/08 "Supported features").
# Checkboxes (Tự Vượt Tháp, Phát chiến đấu) and selected tabs are colour probes, not templates.
#
# Regenerate (needs the corpus locally):
#   .venv\Scripts\python.exe tools/cut_templates.py --crops profiles/ngoalongviet/part_crops.yaml
# Score every part over the corpus:
#   .venv\Scripts\python.exe tools/part_report.py

sources:
  city: {path: "corpus/live/064-city-again.png", origin: [0, 0]}
  harbour: {path: "corpus/live/207-harbour-panel-closed.png", origin: [0, 0]}
  field: {path: "corpus/live/072-field-for-battle.png", origin: [0, 0]}
  world: {path: "corpus/live/123-world-map-2.png", origin: [0, 0]}
  legion: {path: "corpus/live/048-q-doan.png", origin: [0, 0]}
  tower_dialog: {path: "corpus/live/066-tower-dialog.png", origin: [0, 0]}
  research: {path: "corpus/live/050-khoa-ky.png", origin: [0, 0]}
  inventory: {path: "corpus/live/052-trang-bi.png", origin: [0, 0]}
  tinh_tu: {path: "corpus/live/208-tinh-tu-2.png", origin: [0, 0]}
  tinh_tu_auto: {path: "corpus/live/218-tinh-tu-auto-t0.png", origin: [0, 0]}
  building: {path: "corpus/live/196-building-tower-panel.png", origin: [0, 0]}
  confirm: {path: "corpus/live/103-tower-confirm.png", origin: [0, 0]}
  tower_floor: {path: "corpus/live/109-tower-enter-t5.png", origin: [0, 0]}
  tower_lose: {path: "corpus/live/115-tower-run-t5.png", origin: [0, 0]}
  tower_win: {path: "corpus/live/254-tower21-run-t7.png", origin: [0, 0]}
  army: {path: "corpus/live/073-field-army-yellow-click.png", origin: [0, 0]}
  shop: {path: "corpus/live/266-shop-cua-hieu.png", origin: [0, 0]}
  vkt_lobby: {path: "corpus/live/124-vo-khoi-thap.png", origin: [0, 0]}
  vkt_teams: {path: "corpus/live/125-vkt-attack-t0.png", origin: [0, 0]}
