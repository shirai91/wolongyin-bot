crops:
  # --- generic -----------------------------------------------------------------------------------
  - {name: part.close, source: legion, rect: [792, 109, 21, 21]}             # ✕ of every dialog/panel
  - {name: part.box.ok, source: confirm, rect: [430, 320, 46, 20]}           # 确定 of confirm boxes
  - {name: part.box.cancel, source: confirm, rect: [523, 320, 46, 20]}       # 取消

  # --- map HUD -----------------------------------------------------------------------------------
  - {name: part.hud.silver_label, source: city, rect: [100, 30, 26, 16]}     # "Bạc" (player panel)
  - {name: part.hud.home, source: city, rect: [944, 562, 30, 18]}            # 主城 (maps)
  - {name: part.bar.quoc_chinh, source: city, rect: [612, 539, 24, 24]}      # bottom bar icons
  - {name: part.bar.khoa_ky, source: city, rect: [701, 537, 24, 24]}
  - {name: part.bar.trang_bi, source: city, rect: [748, 539, 24, 26]}
  - {name: part.bar.dinh_phu, source: city, rect: [554, 571, 44, 15]}       # "DinhPhủ" label: still shows under the Tinh Tú dialog
  - {name: part.map.vao_hai_cang, source: city, rect: [286, 492, 80, 20]}    # city map label
  - {name: part.map.hai_chien, source: harbour, rect: [350, 507, 62, 18]}    # harbour map label
  - {name: part.map.vo_khoi_thap, source: world, rect: [203, 361, 70, 18]}   # world map label
  - {name: part.field.next, source: field, rect: [568, 566, 22, 24]}         # "»" next dungeon
  - {name: part.field.prev, source: field_dong_trac, rect: [411, 566, 22, 24]}  # "«" previous dungeon (the last dungeon has no »)
  - {name: part.icon.tinh_tu, source: world_live, rect: [494, 102, 26, 23]}  # Tinh Tú wheel in the top icon rows (moves with the account)
  - {name: part.hud.icons_hidden, source: icons_hidden, rect: [820, 70, 20, 16]}  # "<<": the top icon rows are hidden (">>" when shown)
  - {name: part.hud.icons_shown, source: city_r3, rect: [820, 70, 20, 16]}   # ">>": the top icon rows are shown (click: hide them)
  - {name: part.hud.notice_open, source: city_r3, rect: [2, 129, 17, 17]}    # "<<" of the left notice list (Thu, Được tăng cấp khoa kỹ, ...)
  - {name: part.map.lv, source: city_r3_bare, rect: [412, 100, 9, 11]}       # "lv" of a building label "lvN" (matched on its white ink, parts.yaml)

  # --- dialog titles (searched in the title strip of a dialog frame) -----------------------------
  - {name: part.title.tower, source: tower_dialog, rect: [455, 103, 90, 18]}     # Tháp Thí Luyện
  - {name: part.title.research, source: research, rect: [455, 103, 90, 18]}      # Phủ Sách Lược
  - {name: part.title.inventory, source: inventory, rect: [470, 103, 60, 18]}    # Trang bị
  - {name: part.title.tinh_tu, source: tinh_tu, rect: [470, 62, 60, 18]}         # Tinh Tú
  - {name: part.title.group_battle, source: group_room, rect: [465, 103, 70, 18]}  # Đoàn chiến (group army on the field)

