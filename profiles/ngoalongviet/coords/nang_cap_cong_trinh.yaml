# Click offsets recovered from AutoNgoaLong v1.8.0 (decompiled source).
# Split from reverse/coordinates.yaml: one file per top-level key (feature).
# All values are (dx, dy) relative to the game origin, canvas at 100% zoom (~1000x600).

nang_cap_cong_trinh:                 # NCCT_* – building upgrades
  upgrade: [375, 325]
  close: [690, 204]
  # Thành chính (OCR, 2026-10-06): the city level is the yellow number in the round badge under the
  # avatar ("80", "110"); every building carries a white "lvN" label on its body. A building is
  # clicked at its label centre + each offset in turn until its panel opens (just above the label
  # is roof, the label itself also sits on the building).
  city_level_region: [4, 96, 36, 34]       # canvas x, y, w, h
  label_click_offsets:
    - [0, -14]
    - [0, 0]
  # thanh_chinh_buildings: v1.8.0's fixed points, no longer used by Thành chính (kept for reference)
  thanh_chinh_buildings:             # 18 used (array sized 19)
    - [160, 300]
    - [230, 320]
    - [310, 360]
    - [310, 260]
    - [144, 258]
    - [455, 300]
    - [520, 340]
    - [550, 465]
    - [640, 420]
    - [675, 500]
    - [770, 470]
    - [770, 120]
    - [545, 72]
    - [660, 123]
    - [540, 131]
    - [883, 243]
    - [800, 300]
    - [900, 350]
  hai_cang_buildings:
    - [775, 140]
    - [570, 125]
    - [865, 250]
    - [850, 400]
    - [570, 345]
    - [440, 272]
