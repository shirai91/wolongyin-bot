# Click offsets recovered from AutoNgoaLong v1.8.0 (decompiled source).
# Split from reverse/coordinates.yaml: one file per top-level key (feature).
# All values are (dx, dy) relative to the game origin captured with F9 ("TOADO_GOC"),
# in client pixels of the captured window, for the game canvas at 100% zoom (~1000x600).
# Delays are the v1.8.0 defaults; "delay" means the user-entered value.

common:
  close_result_ok: [538, 409]        # OK button on battle result dialog (TTL uses [538, 407])
  confirm_dialog_ok: [455, 325]      # "Đồng ý" in tower dialogs
  quantity_box: [425, 288]           # numeric field in buy dialogs (double-click, then type)
