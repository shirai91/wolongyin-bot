# Click offsets recovered from AutoNgoaLong v1.8.0 (decompiled source).
# Split from reverse/coordinates.yaml: one file per top-level key (feature).
# All values are (dx, dy) relative to the game origin, canvas at 100% zoom (~1000x600).
# Used by ngoalong/features/chua_cong.py and thap_thi_luyen.py (shared helpers: features/_tower.py).
# The port keeps the v1.8.0 values; dialogs, confirm boxes and the battle screen are recognised
# through the tower.* scenes (scenes/tower.yaml) instead of blind sleeps.

thap:                                # shared by CAYCAPCHUACONG and THAPTHILUYEN
  open_tower: [525, 320]             # v1.8.0 only. Moved live (docs/07): the port opens the tower
                                     # through the city / city.building_panel scene objects.
  page_back: [208, 475]              # clicked 26x to reach page 1 (CAYCAPCHUACONG)
  page_next: [290, 475]
  floor_list_x: 245
  floor_list_y0: 215                 # floor slot n (1..floors_per_page) at y = 215 + floor_step_y*(n-1)
  floor_step_y: 25                   # v1.8.0 TOADOVITRI_Y step
  floors_per_page: 10                # as v1.8.0. The list shows only UNLOCKED floors (live 2026-10-06:
                                     # Tầng 1-6 shown, slots 7-10 empty), so fewer buttons ≠ smaller page
  sweep_button: [395, 467]           # CAYCAPCHUACONG ("vượt tháp")
  challenge_button: [338, 467]       # THAPTHILUYEN
  exit_tower: [960, 565]             # "Thoát"; the port clicks the tower.battle exit object (same button)
  ttl_send_box: [255, 477]           # THAPTHILUYEN: double-click, type "1", Enter
  floor_paging: "page = ceil(floor/10) - 1 next-clicks; slot = floor - page*10"
                                     # ^ v1.8.0 note, kept verbatim; the port pages by floors_per_page
