# Feature 4 · Tháp Thí Luyện (docs/08 "Feature flows" 4). The floor map itself is a base screen
# (base.yaml: tower.floor).

tower.dialog:               # medium dialog, tabs Tháp / Luyện / Điểm tướng; reopens on its last tab and page
  layer: dialog
  require: [title.tower]
  close: [802, 119]
  read:
    tab: {tabs: [Tháp, Luyện, Điểm tướng]}
    page: {digits: tower.page}                  # page N lists floors 10(N-1)+1 .. 10N (only those reached)
    tokens: {digits: tower.tokens}              # Thí luyện lệnh
    rows: {grid: {at: [197, 206, 101, 22], dy: 25, n: 10, filled: row.filled, selected: row.selected,
                  number: [9, 5, 84, 13], page: page, per_page: 10}}
    floors: {from: rows, pick: numbers}
    selected: {from: rows, pick: selected_number}
    climb: {point: btn.vuot_thap}               # Vượt Tháp -> confirm -> floor map
    sweep: {point: btn.tu_vuot_thap}            # Tự Vượt Tháp -> sweep panel (floors already won)

tower.sweep:                # side panel "Hãy nhập số lần vào": count box, cost Vàng*0, 确定 / 取消
  layer: dialog
  z: 2
  over: [tower.dialog]
  require: [tower.sweep]
  read:
    runs: {digits: tower.sweep_runs}

tower.result:               # 战胜 box (Thoát only) or 战败 box (Tiếp tục, Thoát) on the floor map
  layer: dialog
  over: [tower.floor]
  require: [[result.win, result.lose]]
  read:
    result: {first_of: {win: result.win, lose: result.lose}}
    can_continue: {present: result.continue}
    exit: {point: result.exit}
