# Golden expectations for the stored screenshots (docs/07). Paths are relative to the project root.
# canvas: expected top-left (x, y) of the 1000x600 canvas in the image; a detection within 2 px passes.
# scene:  expected SceneDetector result; overlays: overlay scenes that must also be reported.
# via_anchors: the black-border method fails on this image, so the anchors alone must agree.

reference:   # docs/game screenshots/*.png, canvas values from the docs/07 table
  - {file: "docs/game screenshots/main-game.png", canvas: [273, 109], scene: city, overlays: [overlay.toast]}
  - {file: "docs/game screenshots/dungeon.png", canvas: [272, 110], scene: field}
  - {file: "docs/game screenshots/worldmap-ui.png", canvas: [270, 107], scene: world_map}
