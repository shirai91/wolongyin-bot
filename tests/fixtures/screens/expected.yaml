  - {file: "docs/game screenshots/tower-ui-enter-confirmation.png", canvas: [270, 110], scene: tower.confirm}
  - {file: "docs/game screenshots/chest-rolling-ui.png", canvas: [271, 112], scene: chest.wheel}
  - {file: "docs/game screenshots/tower-in-dungeon.png", canvas: [272, 110], scene: tower.battle, via_anchors: true}

