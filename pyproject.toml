[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ngoalong"
version = "2.0.1"
description = "AutoNgoaLong: bot for the Flash webgame Ngoa Long, Coowon browser, Windows"
readme = "docs/README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "pywin32>=306; sys_platform == 'win32'",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "PySide6>=6.7",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "tomli-w>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ngoalong*"]
